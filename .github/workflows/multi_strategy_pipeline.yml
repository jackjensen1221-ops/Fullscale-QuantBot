name: QuantFund Multi-Strategy Engine

on:
  schedule:
    # 1. Intraday Execution: Runs every hour during US market hours (14:00 - 21:00 UTC, Mon-Fri)
    - cron: '30 14-21 * * 1-5'
    # 2. Nightly Research Lab: Runs every weekday at 2:00 AM UTC (9:00 PM EST)
    - cron: '0 2 * * 1-5'
  workflow_dispatch:

jobs:
  run-fund-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Master Orchestrator
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_SECRET_KEY: ${{ secrets.APCA_SECRET_KEY }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python core_engine.py

      - name: Auto-Commit Fund Performance Logs & Audit Trails
        run: |
          git config --global user.name "QuantFund Bot"
          git config --global user.email "bot@quantfund.local"
          git add performance_log.json || true
          git commit -m "📊 Multi-Strategy Fund Audit & Performance Snapshot [skip ci]" || echo "No changes to commit"
          git push || echo "No push required"
